spring.config.import=optional:file:.env[.properties]
spring.application.name=budgeting

# Audio uploads: 25 MB matches the OpenAI transcription limit.
spring.servlet.multipart.max-file-size=25MB
# The request also carries multipart headers, so it needs headroom for a file of exactly 25 MB.
spring.servlet.multipart.max-request-size=26MB
# Let Tomcat read past the limit so the client receives HTTP 413 instead of a reset connection.
server.tomcat.max-swallow-size=30MB

# DB
spring.datasource.url=${DB_URL_KEY:jdbc:postgresql://localhost:5432/budgeting}
server.port=${SERVER_PORT_KEY}
spring.datasource.username=${DB_USER_KEY}
spring.datasource.password=${DB_PASSWORD_KEY}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# SQL logging is off by default. To debug, set LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
# (Hibernate) or LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE_JDBCTEMPLATE=DEBUG (chat memory).

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring Ai Chat Memory
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

# Closed and expired AI conversations are deleted with their messages.
# This job also covers users who never come back after their conversation expires.
ai.conversation-cleanup.interval=PT1H

# Chat models are created per user
spring.ai.model.chat=none

#Encrypt Configuration
ai.encryption.password=${AI_ENCRYPTION_PASSWORD}
ai.encryption.salt=${AI_ENCRYPTION_SALT}

